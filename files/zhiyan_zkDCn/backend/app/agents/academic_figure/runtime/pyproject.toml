[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "academic-figure-agent"
version = "0.1.0"
description = "LangGraph agent for reproducible academic figures powered by Alibaba Bailian."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
  "openpyxl>=3.1,<4.0",
  "pillow>=10.4,<13.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "pytest-cov>=5.0,<8.0", "ruff>=0.8,<1.0"]

[project.scripts]
academic-figure-agent = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_figure_agent", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
