[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-translation-agent"
version = "0.1.0"
description = "Single-model local-Ollama academic translation agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pymupdf>=1.24",
  "Pillow>=10.4",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
academic-translation-agent = "academic_translation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
