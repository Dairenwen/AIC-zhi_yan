# Alembic single-database config for langgraph-agent (no backend path dependency).
# Real DATABASE_URL is injected by migrations/env.py from config.settings.

[alembic]
# Migration scripts directory (relative to this ini file).
script_location = %(here)s/migrations

# Prepend to sys.path so env.py can import config / langgraph_agent.
prepend_sys_path = .
path_separator = os

# Placeholder URL; overridden by env.py from Settings.DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
